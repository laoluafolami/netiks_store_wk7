name: 🐳 Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to deploy, e.g. v1.1.0"
        required: true
        type: string

jobs:
  validate:
    name: 🔍 Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 📦 Install Python dependencies
        run: |
          pip install black flake8 mypy
          if [ -d "packages/shared-python" ]; then pip install -e packages/shared-python; fi
      - name: 🧹 Lint Python code
        run: |
          echo "Running Python linting..."
          black --check apps/ services/ || true
          flake8 apps/ services/ || true
      - name: ⚛️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 📦 Install Node.js dependencies
        run: |
          cd apps/web
          npm ci || true
      - name: 🧹 Lint web application
        run: |
          cd apps/web
          npm run lint || true
      - name: 🐳 Validate Docker Compose configuration
        run: |
          touch .env
          docker compose config --quiet || true

  build-and-push:
    name: 🐳 Build and Push Images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service:
          - web
          - gateway
          - identity-service
          - vendor-service
          - catalog-service
          - media-service
          - admin-service
        include:
          - service: web
            dockerfile: infra/docker/web.Dockerfile
          - service: gateway
            dockerfile: apps/gateway/Dockerfile
          - service: identity-service
            dockerfile: services/identity-service/Dockerfile
          - service: vendor-service
            dockerfile: services/vendor-service/Dockerfile
          - service: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - service: media-service
            dockerfile: services/media-service/Dockerfile
          - service: admin-service
            dockerfile: services/admin-service/Dockerfile
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 🐳 Login to ACR via OIDC
        run: az acr login --name netiksstoreregistry

      - name: 🏷️ Extract metadata for Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: 🚀 Deploy to Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🚀 Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            
            echo "🔐 Authenticating to Azure using VM Managed Identity..."
            az login --identity
            
            echo "🐳 Logging into ACR..."
            az acr login --name netiksstoreregistry
            
            cd ~/netiks_store
            
            # 1. Fetch the latest code FIRST
            echo "📥 Fetching latest code..."
            git fetch origin
            git reset --hard origin/main
            
            # 2. Export the variables so Docker Compose can actually see them!
            export VERSION="$(git rev-parse HEAD | cut -c1-7)"
            export IMAGE_TAG="$(git rev-parse HEAD | cut -c1-7)"
            export REGISTRY="netiksstoreregistry.azurecr.io"
            echo "🚀 Deploying image tag: $IMAGE_TAG"
            
            # 3. Pull and start the containers
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull
            
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d
            
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COMMIT_SHA
          script: |
            set -e
            
            echo "🔐 Authenticating to Azure using VM Managed Identity..."
            az login --identity
            
            echo "🐳 Logging into ACR..."
            az acr login --name netiksstoreregistry
            
            cd /home/deploy/netiks_store-staging
            
            echo "📥 Fetching latest main branch..."
            git fetch origin main
            git checkout --force main
            git reset --hard origin/main
            
            echo "🏷️ Getting the short SHA from the current Git commit..."
            export IMAGE_TAG="$(git rev-parse HEAD | cut -c1-7)"
            export REGISTRY="netiksstoreregistry.azurecr.io"
            echo "Using IMAGE_TAG=$IMAGE_TAG"
            
            echo "📦 Pulling SHA-tagged images..."
            docker compose \
              -p netiks_staging \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              pull
              
            echo "🚀 Starting staging services..."
            docker compose \
              -p netiks_staging \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              up -d
              
            echo "✅ Staging deployment complete!"
            docker compose -p netiks_staging ps