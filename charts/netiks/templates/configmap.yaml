apiVersion: v1
kind: ConfigMap
metadata:
  name: netiks-config
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.accessTokenExpireMinutes | quote }}
  UPLOAD_DIR: {{ .Values.config.uploadDir | quote }}
  IDENTITY_SERVICE_URL: "http://identity-service:8001"
  VENDOR_SERVICE_URL: "http://vendor-service:8002"
  CATALOG_SERVICE_URL: "http://catalog-service:8003"
  MEDIA_SERVICE_URL: "http://media-service:8004"
  INTERNAL_API_BASE_URL: "http://gateway:8000/api/v1"
  NEXT_PUBLIC_API_BASE_URL: {{ .Values.config.publicApiBaseUrl | quote }}