apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: netiks
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: netiks
spec:
  replicas: 1                      # database-backed: runs 'alembic upgrade head' at startup, so keep one copy
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: catalog-service
          image: netiks/catalog-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:                       # per-service values (replace the Compose 'environment:' block)
            - name: APP_NAME
              value: catalog-service
            - name: APP_PORT
              value: "8003"
          envFrom:                   # load ALL keys of the ConfigMap and Secret as environment variables
            - configMapRef:
                name: netiks-config
            - secretRef:
                name: netiks-secrets
          startupProbe:              # runs first; others wait until it succeeds
            httpGet:
              path: /health/live
              port: 8003
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:             # failing = container is restarted
            httpGet:
              path: /health/live
              port: 8003
            periodSeconds: 10
          readinessProbe:            # failing = Pod is removed from the Service (no traffic)
            httpGet:
              path: /health/ready
              port: 8003
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi