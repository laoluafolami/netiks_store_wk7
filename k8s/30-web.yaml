apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: netiks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: netiks/web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: development
          envFrom:                    # brings in INTERNAL_API_BASE_URL and NEXT_PUBLIC_API_BASE_URL
            - configMapRef:
                name: netiks-config
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: netiks
spec:
  type: NodePort               # opens a port on the node so your browser can reach it
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300          # kind forwards your localhost:3001 to this port