[project]
name = "netiks-shared"
version = "0.1.0"
description = "Shared platform utilities for Netiks Store Python services."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic-settings>=2.10.1,<3.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netiks_shared"]

