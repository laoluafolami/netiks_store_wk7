[project]
name = "admin-service"
version = "0.1.0"
description = "Admin service for Netiks Store."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "netiks-shared"
]

[tool.uv.sources]
netiks-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

